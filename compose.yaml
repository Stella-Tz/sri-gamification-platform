services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sri_smart_tool
    volumes:
      - sri-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sri_smart_tool"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sri_smart_tool?schema=public
      SESSION_SECRET: sri_local_docker_secret
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run prisma:seed &&
      npm run dev
      "

  client:
    build:
      context: ./client
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  sri-postgres-data:
