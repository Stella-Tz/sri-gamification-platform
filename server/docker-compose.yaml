services:
  db:
    image: postgres:16-alpine
    container_name: sri-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sri_smart_tool
    ports:
      - "5433:5432"
    volumes:
      - sri-postgres-data:/var/lib/postgresql/data

volumes:
  sri-postgres-data: